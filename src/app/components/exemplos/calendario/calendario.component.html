<section>

  <app-alerta-card title="# Exemplo de calendário!">
    <p>Exemplo de uso do calendário nativo HTML 5 com o css da dsys-lib-estilos</p>
  </app-alerta-card>

  <form style="width: 100%">
    <br />
    <small> <p>Exemplo de uso comum</p></small>

    <br />
    <label class="brad-calendario brad-text-field brad-m-md-b">
      <input type="month" aria-label="Campo de data" value="" placeholder="dd/mm/aaaa" />
      <em aria-hidden="true" class="leading-icon i icon-ui-calendar complements"></em>
      <small aria-hidden="true" class="placeholder-label-field">Mês ano</small>
      <em class="validation-icon complements"></em>
      <div class="brad-text-field--background"></div>
    </label>
    <br />
    <br />
    <small> <p>Exemplo de uso do com Flex</p></small>

    <br />
    <section class="brad-m-lg-b" style="width: 100%">
      <div class="brad-flex brad-flex-row" style="width: 100%">
        <div class="brad-calendario-flex brad-p-xs brad-m-xs-b">
          <label class="brad-text-field brad-m-md-b" style="width: 100%">
            <input type="date" aria-label="Campo de data" placeholder="dd/mm/aaaa" style="width: 100%" required />
            <em aria-hidden="true" class="leading-icon i icon-ui-calendar complements"></em>
            <small aria-hidden="true" class="placeholder-label-field">De</small>
            <em class="validation-icon complements"></em>
            <div class="brad-text-field--background"></div>
          </label>
        </div>
        <div class="brad-calendario-flex brad-p-xs brad-m-xs-b">
          <label class="brad-text-field brad-m-md-b" style="width: 100%">
            <input type="date" aria-label="Campo de data" placeholder="dd/mm/aaaa" style="width: 100%" />
            <em aria-hidden="true" class="leading-icon i icon-ui-calendar complements"></em>
            <small aria-hidden="true" class="placeholder-label-field">Até</small>
            <em class="validation-icon complements"></em>
            <div class="brad-text-field--background"></div>
          </label>
        </div>
      </div>
    </section>
    <small> <p>Exemplo de uso com Grid</p></small>

    <br />
    <div class="container">
      <div class="row">
        <div class="col-6 brad-flex brad-flex-justify-content-center">
          <div class="brad-calendario brad-p-xs brad-m-xs-b">
            <label class="brad-text-field brad-m-md-b">
              <input type="date" aria-label="Campo de data" placeholder="dd/mm/aaaa" style="width: 100%" />
              <em aria-hidden="true" class="leading-icon i icon-ui-calendar complements"></em>
              <small aria-hidden="true" class="placeholder-label-field">De</small>
              <em class="validation-icon complements"></em>
              <div class="brad-text-field--background"></div>
            </label>
          </div>
        </div>
        <div class="col-6 brad-flex brad-flex-justify-content-center">
          <div class="brad-calendario brad-p-xs brad-m-xs-b">
            <label class="brad-text-field brad-m-md-b">
              <input type="date" aria-label="Campo de data" placeholder="dd/mm/aaaa" style="width: 100%" />
              <em aria-hidden="true" class="leading-icon i icon-ui-calendar complements"></em>
              <small aria-hidden="true" class="placeholder-label-field">Até</small>
              <em class="validation-icon complements"></em>
              <div class="brad-text-field--background"></div>
            </label>
          </div>
        </div>
      </div>
    </div>
  </form>
  <div class="rodape">
    <button class="brad-btn brad-btn-primary brad-btn-floating brad-font-button" (click)="voltar()">Voltar</button>
  </div>
</section>
