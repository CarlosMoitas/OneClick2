name: Node FED Pull Request Check
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop
      - main
permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  merge-check:
    uses: Bradesco-Core/reusable-workflows/.github/workflows/fed-angular-build-sandbox.yaml@latest
    with:
      enabled-fortify: ${{ vars.G_FORTIFY_SAST_RELEASE_ENABLED }}
      enabled-sonar: ${{ vars.G_SONARQUBE_RELEASE_ENABLED }}
      enabled-mend: ${{ vars.G_MEND_RELEASE_ENABLED }}
      prcheck: true
    secrets: inherit
  
  call-deploy-hom:
    needs: merge-check
    # Skip deploy to HOM if hotfix
    if: ${{ ! startsWith(needs.call-build.outputs.pull-request-head-ref, 'cherry-picked-hotfix/') }}
    uses: Bradesco-Core/reusable-workflows/.github/workflows/fed-deploy-release.yaml@latest
    with:
      version: ${{ needs.merge-check.outputs.version }}
      package-group: ${{ needs.call-build.outputs.package-group }}
      environment: 'HOM'
      prcheck: true
    secrets: inherit

