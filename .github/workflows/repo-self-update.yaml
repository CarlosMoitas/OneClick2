name: Self update

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - self-update
      - self-update-service
      - self-update-service-fed
      - self-update-service-node
      - self-update-service-fed-typescript-node

jobs:
  call-files-update-for-workflows:
    name: Call files update for workflows
    uses: Bradesco-Core/reusable-workflows/.github/workflows/files-update.yaml@latest
    secrets:
      app-id: ${{ secrets.HACTAR_WORKFLOWS_CONCIERGE_APP_ID }}
      app-private-key: ${{ secrets.HACTAR_WORKFLOWS_CONCIERGE_APP_PRIVATE_KEY }}
    with:
      source-repo: >-
        ${{ format('{0}/{1}',
          github.repository_owner,
          'reusable-workflows'
        ) }}
      source-tag: 'latest' # TODO:HIGH - change upon release
      source-dir: >-
        ${{ format('reusable-callers/{0}',
          github.event.repository.custom_properties.technology ||
          'fed-typescript-node'
        ) }}
      reference-files: '**'
      target-dir: '.github/workflows'
      auto-merge: true
      base-pr-branch: ${{ github.ref_name || github.event.repository.default_branch }}
      head-pr-branch: ${{ format('self-update-{0}', github.ref_name || github.event.repository.default_branch) }}

  call-files-update-for-configs:
    name: Call files update for config files
    if: false # Disable until actually using.
    uses: Bradesco-Core/reusable-workflows/.github/workflows/files-update.yaml@latest
    secrets:
      app-id: ${{ secrets.HACTAR_CONFIGS_CONCIERGE_APP_ID }}
      app-private-key: ${{ secrets.HACTAR_CONFIGS_CONCIERGE_APP_PRIVATE_KEY }}
    with:
      source-repo: >-
        ${{ format('{0}/{1}',
          github.repository_owner,
          'reusable-configurations'
        ) }}
      source-tag: 'latest' # TODO:HIGH - change upon release
      source-dir: >-
        ${{
          github.event.repository.custom_properties.technology ||
          'fed-typescript-node'
        }}
      reference-files: '**'
      target-dir: '.'
      auto-merge: true
      base-pr-branch: ${{ github.ref_name || github.event.repository.default_branch }}
      head-pr-branch: ${{ format('self-update-{0}', github.ref_name || github.event.repository.default_branch) }}
